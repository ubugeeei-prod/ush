name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly supply-chain rescan even when nothing changes
    - cron: "0 6 * * 1"

concurrency:
  # On PR pushes we want the newest run to cancel the previous one
  # (group by ref). On main pushes we want every commit to actually
  # finish, so we expand the group with `run_id` to make each run
  # unique and turn cancel-in-progress into a no-op.
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  tynix:
    name: Typed Nix configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify with pinned tynix release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          work=$(mktemp -d)
          gh release download v2.0.0 --repo ubugeeei-prod/tynix --pattern 'tynix-v2.0.0-linux-x64.tar.gz' --pattern 'tynix-v2.0.0-linux-x64.sha256' --dir "$work"
          (cd "$work" && sha256sum -c tynix-v2.0.0-linux-x64.sha256 && tar -xzf tynix-v2.0.0-linux-x64.tar.gz)
          TYNIX="$work/tynix-2.0.0-linux-x64/bin/tynix" sh scripts/check_tynix.sh

  editor:
    name: Editor extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test grammar and verify the bundled client
        working-directory: editors/vscode
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          git diff --exit-code -- dist/extension.js

  line-limit:
    name: Line Limit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce Rust file line limit
        run: sh scripts/check_rs_line_limit.sh

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.9.1
        with:
          key: ${{ matrix.os }}

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read workspace rust-version
        id: msrv
        run: |
          version="$(awk '
            /^\[workspace.package\]$/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && $1 == "rust-version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "could not find rust-version in [workspace.package]" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.9.1
        with:
          key: msrv

      - name: Check workspace against MSRV
        run: cargo check --locked --workspace --all-targets

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

  deny:
    name: Deny (licenses, sources, bans)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny
        # `bans` runs alongside the other checks so duplicate-version
        # trees show up in the CI log even though `multiple-versions`
        # is set to warn-level (the vendored rustyline currently
        # pulls in some duplicates). Flip `multiple-versions = "deny"`
        # in deny.toml once those are deduplicated.
        run: cargo deny --workspace check licenses sources advisories bans

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    needs:
      - clippy
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.9.1
        with:
          key: bench

      - name: Check out the PR base for same-runner measurements
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bench-base
          persist-credentials: false

      - name: Compare base and PR benchmarks on the same runner
        if: github.event_name == 'pull_request'
        run: sh scripts/compare_benchmarks.sh .bench-base

      - name: Run parser bench
        if: github.event_name == 'push'
        run: cargo bench --locked -p ush_shell --bench parser -- --output-format bencher | tee bench-output.txt

      - name: Run compile bench
        if: github.event_name == 'push'
        run: cargo bench --locked -p ush_compiler --bench compile -- --output-format bencher | tee -a bench-output.txt

      - name: Publish benchmark history on main
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Criterion microbenchmarks
          tool: cargo
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: bench
          summary-always: true
          alert-threshold: "125%"
          fail-on-alert: false
          comment-on-alert: true
          alert-comment-cc-users: "@ubugeeei"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs:
      - line-limit
      - format
      - clippy
      - msrv
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2.9.1
        with:
          key: ${{ matrix.os }}

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Exercise generated artifacts on sh, dash, bash, zsh and BusyBox ash
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox zsh shellcheck
          sh scripts/test_targets.sh

      - name: Verify generated bootstrap scripts
        run: sh scripts/check_generated.sh

      - name: Test installer flow
        run: sh scripts/test_install.sh

      - name: Check no_std compiler core
        run: cargo check --locked -p ush_compiler --no-default-features

      - name: Clippy no_std compiler core
        # Catches lints that only fire under no_std (panic / alloc /
        # missing impls), separately from the std-mode clippy gate
        # in the Clippy job.
        run: cargo clippy --locked -p ush_compiler --no-default-features --lib --no-deps -- -D warnings

      - name: Run no_std compiler tests
        run: cargo test --locked -p ush_compiler --no-default-features --lib

      - name: Run release tests
        run: cargo test --locked --workspace --release

      - name: Build rustdoc with warnings as errors
        # Catch broken intra-doc links and stale doc snippets before
        # they break a future docs publish.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --no-deps --document-private-items

      - name: Build benches
        run: |
          cargo bench --locked -p ush_shell --no-run
          cargo bench --locked -p ush_compiler --no-run

      - name: Type-check every example .ush
        # Gate every committed example through `ush check` so a
        # breaking change to the type checker / compiler is caught
        # before it lands, not on the next contributor's bug report.
        run: |
          set -e
          for example in examples/*.ush; do
            echo "ush check $example"
            cargo run --locked -p ush --quiet -- check "$example"
          done

      - name: Verify every example .ush is `ush format` clean
        # Dogfood the formatter on the example corpus so we notice
        # immediately when a formatter change makes already-checked-in
        # examples drift.
        run: |
          set -e
          for example in examples/*.ush; do
            echo "ush format --check $example"
            cargo run --locked -p ush --quiet -- format --check "$example"
          done

      - name: Run async example
        run: |
          output="$(cargo run --locked -p ush --quiet -- examples/async.ush)"
          [ "$output" = "$(printf 'main\nafter\nworker')" ]

      - name: Run ADT example
        run: |
          output="$(cargo run --locked -p ush --quiet -- examples/adt.ush)"
          [ "$output" = "done" ]
